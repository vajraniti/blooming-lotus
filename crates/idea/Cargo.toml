[package]
name = "idea"
version = "0.1.0"
description = "IDEA block cipher (Lai & Massey, 1991): block primitive, round tracing, ECB/CBC/CTR and an authenticated file format."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["alloc"]
alloc = []
seal = ["alloc", "dep:sha2", "dep:hmac", "dep:hkdf"]

[dependencies]
zeroize = { version = "1.9", default-features = false }
sha2 = { version = "0.11", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
hkdf = { version = "0.13", default-features = false, optional = true }

[lints]
workspace = true
