[workspace]
resolver = "3"
members = ["crates/idea", "crates/idea-wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Word-level crypto code casts between u16/u32/u64 on purpose; every cast is range-checked by construction.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
